version: '3.8'

services:
  postgres:
    image: postgres:9.5
    container_name: dev_mem
    environment:
      POSTGRES_DB: dev_mem
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "45533:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: